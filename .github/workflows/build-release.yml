name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd macos
          npm install

      - name: Build (${{ matrix.arch }})
        run: |
          cd macos
          npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            macos/dist/*.dmg
            macos/dist/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: |
          cd desktop
          dotnet publish -c Release -o publish

      - name: Package
        shell: pwsh
        run: |
          cd desktop
          $tag = "${{ github.ref_name }}"
          Rename-Item "publish\HttpTool.exe" "HttpTool-Client.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $items = @("publish\HttpTool-Client.exe")
          if (Test-Path "publish/public") { $items += "publish/public" }
          Compress-Archive -Path $items -DestinationPath "dist/HttpTool-Client-$tag-win-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: desktop/dist/HttpTool-Client-*.zip
          if-no-files-found: error

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/macos-x64/*.dmg
            release/macos-x64/*.zip
            release/macos-arm64/*.dmg
            release/macos-arm64/*.zip
            release/windows-x64/*.zip
          generate_release_notes: true
