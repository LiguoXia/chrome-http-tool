<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"Segoe UI",sans-serif; background:#e8eaee;
         padding:48px; display:flex; flex-direction:column; gap:32px; align-items:flex-start; }
  .row { display:flex; gap:28px; align-items:center; }
  .card { border-radius:36px; padding:44px; display:flex; align-items:center; justify-content:center;
          box-shadow:0 18px 50px rgba(0,0,0,.12); }
  .light { background:#ffffff; }
  .dark { background:#1c1c1e; }
  .sizes { display:flex; gap:24px; align-items:flex-end; background:#fff; padding:28px 32px;
           border-radius:24px; box-shadow:0 10px 30px rgba(0,0,0,.08); }
  .cell { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .cell span { font-size:13px; color:#666; }
  img { display:block; }
</style>
</head>
<body>
  <div class="row">
    <div class="card light"><img src="http-tool-icon.svg" width="360" height="360"></div>
    <div class="card dark"><img src="http-tool-icon.svg" width="360" height="360"></div>
  </div>
  <div class="sizes">
    <div class="cell"><img src="http-tool-icon.svg" width="128" height="128"><span>128</span></div>
    <div class="cell"><img src="http-tool-icon.svg" width="64" height="64"><span>64</span></div>
    <div class="cell"><img src="http-tool-icon.svg" width="48" height="48"><span>48</span></div>
    <div class="cell"><img src="http-tool-icon.svg" width="32" height="32"><span>32</span></div>
    <div class="cell"><img src="http-tool-icon.svg" width="16" height="16"><span>16</span></div>
  </div>
</body>
</html>
